<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart CCTV Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#111827;
            color:white;
        }

        .camera{
            width:100%;
            border-radius:10px;
            border:4px solid #0dcaf0;
        }

        .card{
            background:#1f2937;
            border:none;
        }

        .btn{
            width:100%;
            margin-top:10px;
        }

        h1{
            text-align:center;
            margin:25px;
        }

        .logs{
            background:#1f2937;
            padding:20px;
            border-radius:10px;
        }
    </style>

</head>

<body>

<div class="container-fluid">

<h1>AI Smart CCTV Surveillance Dashboard</h1>

<div class="row">

<div class="col-lg-8">

<img src="{{ url_for('dashboard.video_feed') }}" class="camera">

</div>

<div class="col-lg-4">

<div class="card p-3">

<h4>System Status</h4>

<p>🟢 Online</p>

<p>Known : <span id="known">0</span></p>

<p>Unknown : <span id="unknown">0</span></p>

<p>Alerts : <span id="alerts">0</span></p>

<a href="/capture" class="btn btn-success">
    📸 Capture
</a>

<a href="/start_recording" class="btn btn-danger">
🎥 Start Recording
</a>
<a href="/stop_recording" class="btn btn-secondary">
⏹ Stop Recording
</a>

<button class="btn btn-warning">🚨 Alarm</button>

<button class="btn btn-primary">🔊 Speak</button>

</div>

</div>

</div>

<br>

<div class="logs">

<h3>Recent Events</h3>

<table class="table table-dark">

<tr>
<th>Time</th>
<th>Event</th>
</tr>

<tr>
<td>--</td>
<td>No events yet</td>
</tr>

</table>

</div>

</div>

</body>

</html>
